<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenit Estudio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BARRA SUPERIOR DE NAVEGACIÓN -->
  <nav class="top-bar">
    <a href="#promocion" class="nav-item active">Promoción</a>
    <a href="#estudio" class="nav-item">Estudio</a>
    <a href="#zenit" class="nav-item">Zenit</a> <!-- O #promos, según el id que tenga tu sección de Zenit -->
    <a href="#portafolio" class="nav-item">Portafolio</a>
    <a href="#contacto" class="nav-item">Contacto</a>
  </nav>

  <!-- CONTENEDOR PRINCIPAL (640px) -->
  <main class="main-wrapper">
    <div class="slider-container">

<!-- 1. PROMOCIÓN (hoja_02.svg) -->
      <section id="promocion" class="section">
        <img src="svg/hoja_02.svg" class="layer bg" alt="Promocion">
        
        <!-- Área clickeable del Home (640px x 130px) -->
        <a href="#zenit" class="home-click-area" aria-label="Volver al home"></a>
      </section>

      <!-- 2. ESTUDIO (hoja_01.svg) -->
      <section id="estudio" class="section">
        <img src="svg/hoja_01.svg" class="layer bg" alt="Estudio">
        <!-- Área clickeable de 640x130 abajo -->
        <a href="#zenit" class="home-click-area" aria-label="Volver al home"></a>
      </section>


<!-- 3. ZENIT / HOME (hoja_04.svg) - CENTRO -->
      <section id="zenit" class="section">
        <div class="home-bg-container">
          <img src="svg/hoja_04.svg" class="layer bg" alt="Fondo Home">
        </div>
        <div class="logo-group">
          <img src="svg/estrellas_fondo.svg" class="layer stars-bg" alt="Estrellas Fondo">
          <img src="svg/estrellas_giratorias.svg" class="layer stars-spin" alt="Estrellas Giratorias">
          <img src="svg/logo.svg" class="layer logo" alt="Zenit Estudio Logo">
        </div>
        
        <!-- AQUI AGREGAS LAS FRASES -->
        <div class="frases-container">
          <p id="frase-animada"></p>
        </div>
      </section>

      <!-- 4. PORTAFOLIO (hoja_05.svg) - 1era a la derecha -->
<section id="portafolio" class="section portafolio-container">
  <img src="svg/hoja_05.svg" class="layer bg" alt="Portafolio Fondo">
  <img src="svg/port01.png" class="layer port-imagen" alt="Portafolio Contenido">
  
  <!-- Área clickeable de 640x130 abajo para el Home -->
  <a href="#zenit" class="home-click-area" aria-label="Volver al home"></a>
</section>

      <!-- 5. CONTACTO - 2da a la derecha -->
<section id="contacto" class="section">
  
  <div class="zenit-contacto-container">
    
    <!-- FONDO SVG PLANCHADO -->
    <img src="svg/hoja_06.svg" alt="Fondo Contacto Zenit" class="fondo-contacto-svg">

</section>
